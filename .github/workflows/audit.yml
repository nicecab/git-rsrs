name: Security audit

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml]
  pull_request:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
