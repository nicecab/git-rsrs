[package]
name = "git-rsrs"
version = "0.1.1"
edition = "2024"
description = "Git repository synchronization with external command hooks"
repository = "https://github.com/nicecab/git-rsrs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
humantime = "2"
tempfile = "3"
libc = "0.2"
notify = "8"

[dev-dependencies]
